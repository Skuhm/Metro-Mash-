<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Metro Mash</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Metro Mash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171d26" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* One-screen phone app. Sticky status bar, a schematic transit map of every rail station from Union Station to the beach as home,
   a guided "Now" panel that always shows the single next action, tab bar at the bottom, Show mode for screen-recording. */
:root{
  --ground:#e7ebef; --grid:#d5dbe2; --water:#c9dfee; --shore:#a9c8dd; --land:#f2f4f6; --hilltop:#fbfcfd; --hillside:#d6dde5; --park:#bfe0b0; --park-d:#8fc27d; --park-t:#3f7a30; --cliff:#8fb3cc;
  --panel:#ffffff; --raise:#f3f5f8; --ink:#131821; --muted:#5b6573; --line:#d2d8e0;
  --tile:#ffffff; --tile-l:#c2c9d2; --tile-r:#d8dde4; --tile-dim:#eef1f4;
  --p1:#e23d6d; --p1-l:#a1254a; --p1-r:#c32f5b; --p1-soft:#fde3eb;
  --p2:#2f5ae8; --p2-l:#1c38a3; --p2-r:#264ac7; --p2-soft:#e1e8fd;
  --gold:#eba418; --gold-l:#a6720c; --gold-r:#cb8d12;
  --la:#0072bc; --lb:#e3131b; --ld:#a05da5; --le:#fdb913; --lk:#e56db1; --rail:#8792a1;
  --l1:#2b9d5d; --l2:#1f7fd6; --mono:#8792a1; --slu:#c2362b; --fh:#b8771a;
  --p3:#17a05a; --p3-l:#0d6b3b; --p3-r:#138a4d; --p3-soft:#dcf5e7;
  --p4:#ee7a12; --p4-l:#a3520a; --p4-r:#cf690e; --p4-soft:#fdebd9;
  --p5:#0a9fb4; --p5-l:#066b79; --p5-r:#08899b; --p5-soft:#d8f3f7;
  --p6:#8a4fe0; --p6-l:#5a2fa1; --p6-r:#7642c7; --p6-soft:#ece2fc;
  --take:#0d9888; --stunt:#ec6d0b; --gambit:#131821; --on-gambit:#ffffff; --curse:#7a45d3; --lock:#eba418;
  --ok:#1d8745; --warn:#a96500; --bad:#c22a2a;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0f141b; --grid:#1b232d; --water:#102a3d; --shore:#1f4661; --land:#161d27; --hilltop:#212b38; --hillside:#0c1118; --park:#1f3d27; --park-d:#2f5c39; --park-t:#7fc48d; --cliff:#07121c;
  --panel:#171d26; --raise:#1e2631; --ink:#eef2f6; --muted:#9aa5b2; --line:#2b3542;
  --tile:#46536a; --tile-l:#262e3b; --tile-r:#343e4e; --tile-dim:#2a3240;
  --p1:#ff5c8a; --p1-l:#a32a50; --p1-r:#d1446d; --p1-soft:#3d1624;
  --p2:#6b8cff; --p2-l:#2c47a8; --p2-r:#4f6ee0; --p2-soft:#18234a;
  --gold:#f2b43a; --gold-l:#8f6110; --gold-r:#c58b1d;
  --la:#3d9de6; --lb:#ff4d4d; --ld:#c58ad0; --le:#ffc93a; --lk:#f08cc4; --rail:#7c8796;
  --l1:#3fbf78; --l2:#4aa3ff; --mono:#6c7787; --slu:#ff6a5c; --fh:#e5a040;
  --p3:#38c97b; --p3-l:#1b7a47; --p3-r:#2aa565; --p3-soft:#123222;
  --p4:#ff9a3d; --p4-l:#a85a12; --p4-r:#d97a24; --p4-soft:#3a2310;
  --p5:#2cc7dc; --p5-l:#137a88; --p5-r:#1ea5b8; --p5-soft:#0f2f35;
  --p6:#a67cff; --p6-l:#5d3aa8; --p6-r:#8461e0; --p6-soft:#261a3f;
  --take:#22c2ae; --stunt:#ff8a33; --gambit:#e9eef4; --on-gambit:#131821; --curse:#a07bf0; --lock:#f2b43a;
  --ok:#4cc77a; --warn:#e7a43a; --bad:#ff6b6b; color-scheme:dark } }
:root[data-theme="dark"]{
  --ground:#0f141b; --grid:#1b232d; --water:#102a3d; --shore:#1f4661; --land:#161d27; --hilltop:#212b38; --hillside:#0c1118; --park:#1f3d27; --park-d:#2f5c39; --park-t:#7fc48d; --cliff:#07121c;
  --panel:#171d26; --raise:#1e2631; --ink:#eef2f6; --muted:#9aa5b2; --line:#2b3542;
  --tile:#46536a; --tile-l:#262e3b; --tile-r:#343e4e; --tile-dim:#2a3240;
  --p1:#ff5c8a; --p1-l:#a32a50; --p1-r:#d1446d; --p1-soft:#3d1624;
  --p2:#6b8cff; --p2-l:#2c47a8; --p2-r:#4f6ee0; --p2-soft:#18234a;
  --gold:#f2b43a; --gold-l:#8f6110; --gold-r:#c58b1d;
  --la:#3d9de6; --lb:#ff4d4d; --ld:#c58ad0; --le:#ffc93a; --lk:#f08cc4; --rail:#7c8796;
  --l1:#3fbf78; --l2:#4aa3ff; --mono:#6c7787; --slu:#ff6a5c; --fh:#e5a040;
  --p3:#38c97b; --p3-l:#1b7a47; --p3-r:#2aa565; --p3-soft:#123222;
  --p4:#ff9a3d; --p4-l:#a85a12; --p4-r:#d97a24; --p4-soft:#3a2310;
  --p5:#2cc7dc; --p5-l:#137a88; --p5-r:#1ea5b8; --p5-soft:#0f2f35;
  --p6:#a67cff; --p6-l:#5d3aa8; --p6-r:#8461e0; --p6-soft:#261a3f;
  --take:#22c2ae; --stunt:#ff8a33; --gambit:#e9eef4; --on-gambit:#131821; --curse:#a07bf0; --lock:#f2b43a;
  --ok:#4cc77a; --warn:#e7a43a; --bad:#ff6b6b; color-scheme:dark }

html,body{height:100%;max-width:100%;overflow-x:hidden}
*{box-sizing:border-box;min-width:0}
body{overflow-wrap:anywhere}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:30}
.d{font-family:var(--display);font-stretch:118%;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h1,h2,h3{margin:0}
h1{font-size:30px;line-height:1}
h2{font-size:22px;line-height:1.1}
h3{font-size:17px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}

button{font:inherit;font-weight:700;white-space:normal;max-width:100%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
button.ink{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button.p1{background:var(--p1);color:#fff;border-color:var(--p1)}
button.p2{background:var(--p2);color:#fff;border-color:var(--p2)}
button.good{border-color:var(--ok);color:var(--ok)}
button.bad{border-color:var(--bad);color:var(--bad)}
button.ghost{background:none}
button:disabled{opacity:.35;cursor:default}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0;min-height:46px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.top .r{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top .r>*{min-width:0}
input[type=time]{width:100%;max-width:100%;-webkit-appearance:none;appearance:none}
.plate{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 8px 4px 4px;border-radius:12px;border:1.5px solid transparent}
.plate.up{border-color:var(--ink);background:var(--raise)}
.plate .sw{width:12px;height:28px;border-radius:4px}
.plate .who{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.plate .role{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.plate .nm{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.plate .bank{font-family:var(--display);font-weight:900;font-size:24px;font-stretch:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid var(--line);white-space:nowrap}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.curse{color:var(--curse);border-color:var(--curse);cursor:pointer}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1 1 auto}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.banner{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;font-weight:600}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.banner.bad{border-color:var(--bad);color:var(--bad)}
.banner.ok{border-color:var(--ok);color:var(--ok)}

/* layout: nothing but the main pane scrolls, so the page can never slide sideways */
html,body{position:fixed;inset:0;overflow:hidden;width:100%;height:100%;overscroll-behavior:none}
body{padding-top:env(safe-area-inset-top,0px)}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding-block:0 16px}
.tabs{position:static;flex:0 0 auto}

/* top bar */
.top{padding-block:6px 6px;gap:5px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:grid;grid-template-columns:1fr auto;grid-template-areas:"nm bank" "role bank";align-items:center;column-gap:8px;padding:6px 10px 6px 12px;border-radius:14px;border:2px solid transparent;background:var(--raise);position:relative;overflow:hidden}
.pl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.pl.p1::before{background:var(--p1)}.pl.p2::before{background:var(--p2)}
.pl.up{border-color:var(--ink)}
.pl .nm{grid-area:nm;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:17px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .role{grid-area:role;font-family:var(--display);font-stretch:78%;font-weight:700;font-size:12px;color:var(--muted);line-height:1.1}
.pl.up .role{color:var(--ink)}
.pl .bank{grid-area:bank;font-family:var(--display);font-stretch:100%;font-weight:900;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.status{font-family:var(--display);font-stretch:80%;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{gap:5px}
.chip{font-family:var(--display);font-stretch:85%;font-size:12px;padding:3px 9px}

/* map screen: the map is the room, the sheet is the ticket */
.sheet{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px 12px;display:flex;flex-direction:column;gap:9px;box-shadow:0 -12px 28px -20px rgba(0,0,0,.7)}
.s-kicker{font-family:var(--display);font-stretch:82%;font-weight:600;font-size:13px;color:var(--muted);line-height:1.25}
.s-title{font-family:var(--display);font-stretch:116%;font-weight:900;font-size:26px;line-height:1;letter-spacing:-.01em;text-wrap:balance}
.s-title small{display:block;font-stretch:90%;font-weight:600;font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:0}
.sheet .row{align-items:stretch}
.sheet .row>.go{flex:3 1 auto}
.sheet .row>button:not(.go){flex:1 1 auto}
.go{min-height:52px;font-size:17px;border-radius:16px;font-family:var(--display);font-stretch:108%;font-weight:800}
.routes{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;touch-action:pan-x}
.routes::-webkit-scrollbar{display:none}
.route{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:44px;padding:7px 12px;border-radius:12px;border-style:dashed;text-align:left;max-width:200px}
.route b{font-family:var(--display);font-stretch:105%;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.route span{font-family:var(--display);font-stretch:80%;font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
.mapctl{bottom:12px}

/* card screen */
.strip{display:flex;flex-direction:column;gap:3px;padding:0 2px}
.s-route{font-family:var(--display);font-stretch:112%;font-weight:900;font-size:22px;line-height:1.05;color:var(--muted)}
.s-route b{color:var(--ink)}
.s-route i{font-style:normal;font-weight:600;opacity:.6;padding:0 2px}
.s-meta{font-family:var(--display);font-stretch:82%;font-weight:600;font-size:13px;color:var(--muted)}
.card.settle{border:2px solid var(--ink)}
.actbar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12}
.actbar .go{box-shadow:0 14px 30px -10px rgba(0,0,0,.7);min-height:58px;font-size:18px}
body.oncard main{padding-bottom:96px}
body.playing #tabs{display:none!important}
body.onmap #top{display:none}
body.onmap{padding-top:0}
.fhud{position:absolute;left:0;right:0;top:0;z-index:4;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:grid;grid-template-columns:1fr auto;gap:6px 8px;pointer-events:none}
.fhud>*{pointer-events:auto}
.fplates{display:flex;gap:6px;min-width:0}
.fp{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 12px;min-width:0;border-radius:999px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);border:2px solid transparent;box-shadow:0 6px 16px -8px rgba(0,0,0,.6);font-family:var(--display)}
.fp b{font-stretch:100%;font-weight:800;font-size:14px;max-width:28vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp span{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.fp.p1{box-shadow:inset 4px 0 0 var(--p1),0 6px 16px -8px rgba(0,0,0,.6)}.fp.p2{box-shadow:inset 4px 0 0 var(--p2),0 6px 16px -8px rgba(0,0,0,.6)}
.fp.up.p1{border-color:var(--p1)}.fp.up.p2{border-color:var(--p2)}
.fmenu{display:flex;gap:6px;align-self:start}
.fmenu button{min-height:36px;padding:4px 10px;border-radius:999px;font-family:var(--display);font-size:14px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}
.ffx{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.fx{min-height:28px;padding:2px 10px;border-radius:999px;font-size:12px;font-family:var(--display);border-color:var(--curse);color:var(--curse);background:color-mix(in srgb,var(--panel) 88%,transparent)}
.fclock{grid-column:1/-1;font-family:var(--display);font-stretch:82%;font-weight:700;font-size:12px;color:var(--muted);text-shadow:0 0 6px var(--land),0 0 2px var(--land)}
.tnav{display:flex;gap:6px;align-items:center}.tnav>span{flex:1;min-width:0}
.tnav button{min-height:34px;padding:2px 12px;border-radius:999px;font-family:var(--display);font-size:13px}
.tnav button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.tnav .back{border:0;background:none;padding-left:0;font-weight:800}
.cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--curse);color:#fff;font-size:11px;text-align:center;font-variant-numeric:tabular-nums}
.actbar .go{width:100%}

.tabs{position:static;flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 2px;font-family:var(--display);font-stretch:105%;font-weight:800;font-size:14px;color:var(--muted);min-height:54px}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:3px;vertical-align:top}

/* map */
main.maptab{display:flex;flex-direction:column;overflow:hidden;padding:0}
.mapframe{flex:1;min-height:0;position:relative;background:var(--land)}
.mapview{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mapinner{position:relative}
.mapctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapctl button{min-height:36px;min-width:36px;padding:0 8px;border-radius:10px;font-size:17px;opacity:.92;box-shadow:0 4px 12px -6px rgba(0,0,0,.5)}
.mapctl button[data-act=key]{font-size:13px}
.mapctl button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.selinfo{position:absolute;left:10px;right:10px;top:auto;bottom:12px;right:60px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 4px 12px -6px rgba(0,0,0,.5)}
.key{position:absolute;left:10px;right:62px;bottom:10px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:12px;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.krow{display:flex;align-items:center;gap:8px}.krow span{color:var(--muted)}
.cardchip{display:flex;align-items:center;gap:8px;text-align:left;min-height:44px;padding:8px 12px}
.cardchip span{color:var(--muted);font-weight:600;font-size:13px;flex:1}.cardchip i{font-style:normal;font-size:20px}
.tabs button{white-space:nowrap;font-size:13px}
.mapwrap{background:var(--land);border:1px solid var(--line);border-radius:18px;overflow:hidden;max-width:100%}
.log div span{min-width:0;overflow-wrap:anywhere}
svg.iso{display:block;width:100%;height:auto}
.iso text{font-family:var(--display);font-stretch:108%}
.iso .st{cursor:pointer}
.iso .blk{transform-box:fill-box;transform-origin:50% 100%}
.iso .blk.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:translateY(-16px) scale(.7);opacity:.2}100%{transform:none;opacity:1}}
.iso .train{transition:transform .8s cubic-bezier(.5,0,.2,1)}
.iso .bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.iso .ring{animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.iso .glow{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.35}}
.iso .dash{stroke-dasharray:6 5;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-11}}

/* station panel */
.stp{display:flex;flex-direction:column;gap:10px}
.stp .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.price{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:10px;background:var(--raise);font-family:var(--display);font-weight:900;font-size:18px}
.bigbtn{min-height:56px;font-size:17px;border-radius:14px}

/* cards */
.cf{border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(0,0,0,.45)}
.cf .band{padding:12px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cf .band .fam{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.cf.Take .band{background:var(--take)}
.cf.Stunt .band{background:var(--stunt)}
.cf.Gambit .band{background:var(--gambit);color:var(--on-gambit)}
.cf.Locked .band{background:var(--lock);color:#1a1300}
.cf.Curse .band{background:var(--curse)}
.cf .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.cf h2{font-size:28px}
.cf dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.cf dt{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;padding-top:2px}
.cf dd{margin:0}
.stakes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.stakes button{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;padding:10px;min-width:0;min-height:60px}
.stakes button span{font-size:12px;font-weight:500;color:var(--muted);line-height:1.25}
.meter{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--raise)}
.meter .v{font-family:var(--display);font-weight:900;font-size:30px;font-stretch:100%}
.bidrow{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.bidrow b{font-family:var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bidrow button{min-height:42px;padding:6px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks button{justify-content:flex-start;text-align:left;display:flex;gap:10px;align-items:center}
.checks button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
.call{border:2px dashed var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* curses */
.cur{border:1.5px solid var(--curse);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cur b{color:var(--curse);font-family:var(--display);font-stretch:112%;font-size:18px}

/* log */
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log div{display:grid;grid-template-columns:48px 1fr;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.log time{color:var(--muted)}

/* score */
.sg{display:grid;grid-template-columns:1fr auto auto;gap:8px 16px;align-items:baseline}
.big{font-family:var(--display);font-weight:900;font-size:42px;line-height:1;font-stretch:100%}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:blur(6px)}
.reveal{width:min(420px,100%);perspective:900px}
.reveal .cf,.cf.new{animation:flip .75s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flip{0%{transform:rotateY(100deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
#toast{position:fixed;left:10px;right:10px;top:120px;z-index:35}
#toast .tst{background:var(--curse);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;box-shadow:0 8px 20px -10px rgba(0,0,0,.6);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.howto{width:min(440px,100%);background:var(--panel);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.howto ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}

.show{position:fixed;inset:0;z-index:50;background:var(--ground);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.show .sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;padding:12px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.show .team{border-radius:14px;padding:10px 12px;color:#fff;display:flex;flex-direction:column;gap:2px;min-width:0}
.show .team.t1{background:var(--p1)}
.show .team.t2{background:var(--p2);text-align:right}
.show .team .tn{font-family:var(--display);font-stretch:115%;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show .team .tp{font-family:var(--display);font-weight:900;font-size:34px;line-height:1}
.show .clock{align-self:center;text-align:center;font-family:var(--display);font-weight:900;font-size:22px}
.show .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 12px;position:relative;overflow:hidden}
.show .stage svg{height:100%;width:auto;max-width:100%}
.show .cap{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.show .cap div{background:var(--ink);color:var(--panel);border-radius:14px;padding:12px 16px;font-family:var(--display);font-stretch:118%;font-weight:800;font-size:22px;text-align:center;max-width:560px;animation:capin .5s ease-out both}
.show .cap div small{display:block;font-size:14px;font-weight:600;opacity:.8;margin-top:2px}
@keyframes capin{from{transform:translateY(12px);opacity:0}}
.show .ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 16px;transition:opacity .3s;position:relative;z-index:2;background:var(--ground)}
.show.rec .ctl{opacity:0}
.float{font-family:var(--display);font-weight:900;font-size:16px;animation:floatup 1.4s ease-out forwards}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-26px);opacity:0}}
/* type: one family, two widths. Labels are sentence case, condensed. */
.lbl{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted)}
.cf .band .fam{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:14px;letter-spacing:0;text-transform:none}
.cf h2{font-size:30px;font-stretch:116%;line-height:.98}
.cf dt{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);padding-top:1px}
.cf dd{font-size:15px;line-height:1.4}
.meter .lbl{font-size:12px}
.meter .v{font-size:32px}
button.ink{border-radius:14px}
.bigbtn{font-family:var(--display);font-stretch:106%;font-weight:800}
.tabs button{font-stretch:100%;font-size:14px;min-height:56px;position:relative}
.tabs .cnt{display:inline-block;margin-left:5px;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--curse);color:#fff;font-size:11px;font-variant-numeric:tabular-nums;vertical-align:1px}
.stakes button{font-family:var(--display);font-stretch:106%}
.stakes button span{font-family:var(--body);font-stretch:100%}

/* map: floating navigation over a full-screen map */
.glass{background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.fbottom{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.fbottom>*{pointer-events:auto}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:2px 10px 2px;touch-action:pan-x;overscroll-behavior-x:contain}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:44px;padding:6px 12px;border-radius:14px;text-align:left;max-width:210px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 18px -12px rgba(0,0,0,.7)}
.fchip b{font-family:var(--display);font-stretch:104%;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fchip span{font-family:var(--display);font-stretch:82%;font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
.fchip.hint{border-style:dashed}
.fnav{display:flex;flex-direction:row;gap:8px;align-items:stretch;background:none;border:0;padding:0;box-shadow:none}
.fgo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:62px;padding:10px 18px;border-radius:22px;background:var(--ink);color:var(--panel);border:0;text-align:left;box-shadow:0 16px 32px -14px rgba(0,0,0,.8)}
.fgo b{font-family:var(--display);font-stretch:110%;font-weight:900;font-size:19px;line-height:1.08;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:normal}
.fgo span{font-family:var(--display);font-stretch:84%;font-weight:600;font-size:13px;opacity:.72;line-height:1.25}
.fside{flex:0 0 auto;min-width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:22px;font-family:var(--display);font-weight:800;font-size:15px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 16px 32px -14px rgba(0,0,0,.8)}
.fside small{font-weight:600;font-size:11px;color:var(--muted)}
.fbottom .selinfo,.fbottom .key{position:static;left:auto;right:auto;top:auto;bottom:auto;background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mapctl{top:50%;bottom:auto;transform:translateY(-50%)}
.mapctl button{background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

/* explainer */
.show.xpmode{background:var(--ground)}
.xp{display:flex;flex-direction:column;height:100%;min-height:0}
.xp-head{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 6px;background:var(--panel)}
.xp-dots{flex:1;display:flex;gap:4px;min-width:0}
.xp-dot{flex:1 1 0;min-width:0;min-height:26px;padding:0;border:0;background:none;position:relative;border-radius:0}
.xp-dot::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--line)}
.xp-dot.done::after{background:var(--muted)}
.xp-dot.on::after{background:var(--ink)}
.xp-x{min-height:34px;padding:2px 14px;border-radius:999px;font-family:var(--display);font-size:13px}
.xp-stage{flex:1 1 auto;min-height:170px;position:relative;overflow:hidden;background:var(--land);touch-action:pan-y;cursor:pointer}
.xp-cam{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.xp-over{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;pointer-events:none}
.xp-card{width:min(330px,86%)}
.xp-card .cf{animation:flip .75s cubic-bezier(.2,.9,.3,1.2) both}
.xp-card .cf h2{font-size:24px}
.xp-card .cf .bd{padding:10px 14px 12px;gap:6px}
.xp-hint{position:absolute;left:12px;right:12px;top:12px;padding:8px 12px;border-radius:12px;background:var(--ink);color:var(--panel);font-size:13px;font-weight:700;text-align:center}
.xp-bar{flex:0 0 3px;background:var(--panel)}
.xp-bar i{display:block;height:100%;width:0;background:var(--ink)}
@keyframes xpbar{from{width:0}to{width:100%}}
.xp-cap{flex:0 1 auto;max-height:48%;overflow-y:auto;padding:12px 18px 8px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.xp-n{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:13px;color:var(--muted)}
.xp-cap h2{font-family:var(--display);font-stretch:116%;font-weight:900;font-size:26px;line-height:1.02;letter-spacing:-.01em;text-wrap:balance;animation:xpin .4s ease-out both}
.xp-cap p{margin:0;font-size:16px;line-height:1.45;max-width:62ch;animation:xpin .4s .05s ease-out both}
@keyframes xpin{from{opacity:0;transform:translateY(6px)}}
.xw{display:flex;flex-direction:column;gap:8px}
.xp-nav{flex:0 0 auto;display:grid;grid-template-columns:1fr auto auto 1.5fr;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel)}
.xp-nav button{min-height:48px;border-radius:14px;font-family:var(--display);font-weight:800;padding:6px 12px}
.xp-nav button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.show.xpmode.rec .xp-head,.show.xpmode.rec .xp-nav{display:none}
.xw-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xw-seg button[aria-pressed=true],.xw-chips button[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.xw-out{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.xw-out dt{font-family:var(--display);font-stretch:80%;font-weight:700;color:var(--muted)}
.xw-out dd{margin:0}
.xw-chips{display:flex;flex-wrap:wrap;gap:6px}
.xw-chips button{min-height:36px;padding:4px 12px;border-radius:999px;font-size:13px;font-family:var(--display)}
.xw-msg{font-size:15px;line-height:1.4}
.xw-turn{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:stretch}
.xw-pl{border-radius:14px;padding:8px 12px;background:var(--raise);font-family:var(--display);font-weight:800;font-size:16px;border:2px solid transparent;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xw-pl small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.xw-pl.on.p1{border-color:var(--p1)}.xw-pl.on.p2{border-color:var(--p2)}
.xw-hi{display:flex;align-items:baseline;gap:10px}.xw-hi b{font-family:var(--display);font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}.xw-hi span{color:var(--muted)}
.xw-table{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}.xw-table span{color:var(--muted);font-family:var(--display);font-stretch:85%;font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---- additions for the multi-city, multi-mode app ---- */
.mapinner svg.over{position:absolute;left:0;top:0;width:100%;height:100%}
.mapinner svg.base{pointer-events:none}
button.tc{background:var(--tc);color:#fff;border-color:var(--tc)}
/* home */
.home{display:flex;flex-direction:column;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto;width:100%}
.home-hero{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.home-hero h1{font-size:52px;line-height:.9;font-stretch:125%;font-weight:900;letter-spacing:-.02em}
.home-hero p{margin:0;color:var(--muted);font-size:16px}
.citypick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.citypick button{min-height:56px;font-family:var(--display);font-size:18px;font-weight:900;font-stretch:112%}
.citypick button[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.homethumb{border-radius:18px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;border:1px solid var(--line);background:var(--land)}
.homethumb svg.iso{height:auto}
.ht-hint{margin-top:-6px;text-align:center}
.mode{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.mode h2{font-size:24px}
.mode p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.4}
.mode .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode .row.one{grid-template-columns:1fr}
.resume{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--ink);color:var(--panel);border-color:var(--ink);border-radius:18px;padding:14px 16px}
.resume b{font-family:var(--display);font-size:19px;font-weight:900;font-stretch:110%}
.resume span{font-size:13px;opacity:.75}
.homefoot{font-size:12.5px;color:var(--muted);text-align:center;padding-top:4px}
/* teams: HUD */
.fp.tm{box-shadow:inset 4px 0 0 var(--tc),0 6px 16px -8px rgba(0,0,0,.6);border-color:var(--tc)}
.frv{display:inline-flex;align-items:center;gap:5px;min-height:34px;min-width:0;padding:4px 10px;border-radius:999px;font-family:var(--display);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--panel) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid color-mix(in srgb,var(--tc) 55%,transparent);box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}
.frv i,.tdot i{width:10px;height:10px;border-radius:3px;background:var(--tc);display:inline-block;transform:skewX(-12deg)}
.fplates{flex-wrap:wrap}
i.net{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);vertical-align:1px;margin-right:2px}
i.net.live{background:var(--ok)}i.net.connecting{background:var(--warn);animation:glow 1s ease-in-out infinite alternate}i.net.offline,i.net.refused{background:var(--bad)}
.thud{grid-template-columns:1fr auto}
.pl.tm{border-color:var(--tc)}.pl.tm::before{background:var(--tc)}
.trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tdot{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
#toast .tst b{display:block}
#toast .tst span{display:block;font-weight:500;font-size:12.5px;opacity:.9;white-space:normal}
#toast .tst:has(span){border-radius:16px;white-space:normal}
/* teams: setup, join, pick */
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{font-family:var(--display);font-size:20px;font-weight:900;min-width:96px;text-align:center}
.stepper button{min-width:48px;font-size:22px}
.tset{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--raise);box-shadow:inset 4px 0 0 var(--tc)}
.tset input{width:100%}
.codein{font-family:var(--display);font-size:34px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding:12px}
.invite .code{font-family:var(--display);font-size:44px;font-weight:900;letter-spacing:.16em;text-align:center;line-height:1.1}
.qr{display:flex;justify-content:center}.qr svg{width:min(240px,70vw);height:auto;background:#fff;border-radius:12px;padding:6px}
.tpick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--tc);box-shadow:inset 6px 0 0 var(--tc)}
.tpick b{font-family:var(--display);font-size:20px;font-weight:900;font-stretch:110%}
.tpick span{font-size:13px;font-weight:500;color:var(--muted)}
details.card summary{cursor:pointer;padding:2px 0}
details.card[open] summary{margin-bottom:8px}
/* teams: curses and count */
.tchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tchip{min-height:38px;padding:4px 12px;border-radius:999px;font-family:var(--display);font-size:14px;border:2px solid var(--tc)}
.tchip[aria-pressed=true]{background:var(--tc);color:#fff}
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--raise);box-shadow:inset 5px 0 0 var(--tc)}
.brow .rk{font-family:var(--display);font-weight:900;font-size:18px;color:var(--muted);width:18px;text-align:center}
.brow .bn{display:flex;flex-direction:column;min-width:0}
.brow .bn b{font-family:var(--display);font-weight:900;font-size:17px}
.brow .bn span{font-size:12.5px;color:var(--muted)}
.brow .bn .bd{font-size:12px}
.brow .bt{font-family:var(--display);font-weight:900;font-size:28px;color:var(--tc)}
.arow{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.log .tdot{vertical-align:middle}
/* teams: show mode scoreboard */
.show .sbt{display:flex;gap:8px;align-items:stretch;padding:12px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
.show .sbteam{flex:1 1 0;min-width:84px;border-radius:14px;padding:8px 10px;background:var(--tc);color:#fff;display:flex;flex-direction:column}
.show .sbteam .tn{font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show .sbteam .tp{font-family:var(--display);font-weight:900;font-size:28px;line-height:1}
.show .sbt .clock{align-self:center;padding:0 6px}

/* the teams status line sits on a soft pill so map labels don't fight it */
.fclock.tclock{justify-self:start;background:color-mix(in srgb,var(--land) 86%,transparent);padding:3px 10px;border-radius:999px;text-shadow:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
/* room for a two-line action bar under the card */
body.oncard main{padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
/* five rivals still fit on one row */
.fplates.many .frv{padding:3px 7px;min-height:30px;font-size:13px;gap:4px}
.fplates.many .frv i{width:8px;height:8px}
/* landmark art pauses when the map has been left alone for a few seconds */
.art-still .art *{animation-play-state:paused!important}
/* auctions: a compact strip every team sees while bidding is open */
.aucbar{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.aucrow{background:var(--panel);border:1.5px solid var(--gold);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 24px -16px rgba(0,0,0,.6)}
.aucrow .ab-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.aucrow .ab-t span{color:var(--muted);font-weight:700;font-size:12.5px;white-space:nowrap}
.aucrow .ab-h{color:var(--ink);font-weight:600}
.aucrow .ab-b{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.aucrow .ab-b button{min-height:40px;padding:6px 8px;font-size:15px}
.stack>.aucbar .aucrow{box-shadow:none}
/* the trivia duel takes the whole screen while it runs */
#duel{position:fixed;inset:0;z-index:60;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));overflow:auto}
#duel[hidden]{display:none!important}
#duel .dhd{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#duel .dprog{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
#duel .dbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
#duel .dbar i{display:block;height:100%;background:var(--ink);transform-origin:left center;animation-name:dtime;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes dtime{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#duel .dq{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.22;margin:6px 0 4px}
#duel .dopts{display:grid;gap:10px}
#duel .dopts button{min-height:60px;text-align:left;font-size:17px;padding:12px 16px;border-radius:14px}
#duel .dopts button:disabled{opacity:1}
#duel .dopts button.right,.xw-opts button.right{background:var(--ok);border-color:var(--ok);color:#fff}
#duel .dopts button.wrong,.xw-opts button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
#duel .dnote{font-weight:800;font-size:16px;text-align:center}
#duel .dbody{display:flex;flex-direction:column;gap:12px;margin-top:auto;margin-bottom:auto}
#duel .dbody p{margin:0}
#duel .dscore{font-family:var(--display);font-weight:900;font-size:64px;line-height:1}

.xw-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.xw-opts button{min-height:34px;padding:5px 9px;font-size:13.5px;text-align:left;border-radius:10px}
.xw-opts button:disabled{opacity:1}
.xw-fb{font-weight:800}
.xw-next{min-height:0;padding:2px 10px;font-size:13px;border-radius:999px;margin-left:4px}

.show .stage.pan{justify-content:flex-start;padding-left:0;padding-right:0}
.show .stage.pan svg{height:100%!important;width:auto!important;max-width:none!important;flex:0 0 auto;transition:transform .8s cubic-bezier(.4,0,.2,1)}
.show .stage.pan.drift svg{transition:none;animation:stagedrift var(--pd,50s) ease-in-out infinite alternate}
@keyframes stagedrift{from{transform:translateX(0)}to{transform:translateX(var(--px,0px))}}
@media (prefers-reduced-motion: reduce){.show .stage.pan.drift svg{animation:none;transform:translateX(calc(var(--px,0px) / 2))}}

/* picking where you start: the chosen option lights up and the line under it confirms it */
.stakes button[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.stakes button[aria-pressed=true] span{color:var(--panel);opacity:.8}
.stakes button[aria-pressed=true]::after{content:"✓";position:absolute;top:8px;right:10px;font-weight:900}
.stakes button{position:relative;transition:background .2s,color .2s,transform .2s}
.stakes.flash button[aria-pressed=true]{animation:pickpop .35s ease-out}
@keyframes pickpop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:none}}
.startpick{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--raise);font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.startpick.flash{animation:pickflash .9s ease-out}
@keyframes pickflash{0%{background:color-mix(in srgb,var(--ok) 40%,var(--raise));transform:translateY(-3px)}100%{background:var(--raise);transform:none}}
.startpick .sp{background:var(--tc);color:#fff;border-radius:99px;padding:2px 9px;font-weight:700;font-size:12px}

.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.swatches .sw{width:34px;height:34px;min-width:0;min-height:0;padding:0;border-radius:50%;--c:var(--sw);background:var(--c);border:3px solid var(--raise);box-shadow:0 0 0 1px rgba(0,0,0,.18);transition:transform .15s}
.swatches .sw[aria-checked=true]{box-shadow:0 0 0 2.5px var(--c);transform:scale(1.12)}
.swatches .sw[aria-checked=true]::after{content:"✓";color:#fff;font-weight:900;font-size:14px}
.swatches .sw:disabled{opacity:.22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .swatches .sw{--c:var(--swd)}}
:root[data-theme="dark"] .swatches .sw{--c:var(--swd)}

<script>

"use strict";
// ================= shared helpers =================
const now=()=>Date.now();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const $=q=>document.querySelector(q);
const rid=(n=10)=>{const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const b of r)s+=a[b%a.length];return s};
const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
// which mode and city this page load runs
let MODE="home";

// ================= cities =================
// Each city is data: stations on a schematic grid, the lines through them, extra connectors, sealed challenges,
// scoring areas, map decor, explainer scenes and the copy that names the place. loadCity() turns one into the globals below.
const CITIES={};
let CITY=null,STATIONS=[],ST={},START_ID=null,LINE_PATHS={},LINES=[],LINE_NAME={},RAIL_MODES=[],EDGES=[],ADJ={},EDGE={},LOCKS={},LOCK_IDS=[],MAJ=[],LINE_ORDER=[],LCOL={},SHARED={};
const START=8,HIJACK=5,TKO_CAP=10;
function loadCity(id){
 const C=CITIES[id]||CITIES.la;CITY=C;
 STATIONS=C.stations;ST=Object.fromEntries(STATIONS.map(s=>[s.id,s]));START_ID=C.start;
 LINE_PATHS=Object.fromEntries(Object.entries(C.lines).map(([k,l])=>[k,l.path]));LINES=Object.values(LINE_PATHS);
 LINE_NAME=Object.assign({walk:"walk",bus:"one bus",bike:"bike or trail"},C.modeNames);
 LINE_ORDER=C.lineOrder;
 LCOL=Object.assign({x:"var(--ink)",rail:"var(--rail)"},Object.fromEntries(Object.entries(C.lines).map(([k,l])=>[k,l.col])),C.extraCols||{});
 // rail edges from the line paths; a segment two lines share gets both letters ("bd": B or D Line)
 SHARED={};EDGES=[];
 for(const [k,ids] of Object.entries(LINE_PATHS))for(let i=0;i<ids.length-1;i++){const a=ids[i],b=ids[i+1],key=a<b?a+"|"+b:b+"|"+a;(SHARED[key]=SHARED[key]||[]).push(k)}
 const seen={};
 for(const [k,ids] of Object.entries(LINE_PATHS))for(let i=0;i<ids.length-1;i++){const a=ids[i],b=ids[i+1],key=a<b?a+"|"+b:b+"|"+a;if(seen[key])continue;seen[key]=1;
  const on=SHARED[key].slice().sort(),m=on.join("");const t=(C.slow||{})[key]||(C.fast&&C.fast.has(a)&&C.fast.has(b)?2:Math.min(...on.map(x=>C.lines[x].min)));EDGES.push([a,b,m,t])}
 RAIL_MODES=[...new Set(EDGES.map(e=>e[2]))];
 for(const e of C.extraEdges)EDGES.push(e);
 ADJ={};STATIONS.forEach(s=>ADJ[s.id]=[]);EDGE={};
 for(const [a,b,m,t] of EDGES){const k=a+">"+b;if(EDGE[k]){if(t<EDGE[k].t)EDGE[k]=EDGE[b+">"+a]={m,t};continue}ADJ[a].push(b);ADJ[b].push(a);EDGE[k]=EDGE[b+">"+a]={m,t}}
 LOCKS=C.locks;LOCK_IDS=STATIONS.filter(s=>s.lock).map(s=>s.id);

 if(typeof CARD_BASE!=="undefined")for(const [cid,base] of Object.entries(CARD_BASE)){const c=CARD[cid];for(const k of Object.keys(c))if(!(k in base))delete c[k];Object.assign(c,JSON.parse(JSON.stringify(base)))}
 for(const [cid,ov] of Object.entries(C.cardText||{}))Object.assign(CARD[cid],ov);
}

// ================= deck =================

// ride: done on the vehicle during the hop (no clock cost). span: may run over several hops. Others: done on the platform.
const CARDS=[
 {id:"T0",fam:"Take",n:"Four Agrees In A Row",w:"This ride",d:"Say one take of your own to riders one at a time. Each says agree or disagree on camera. A disagree resets you to zero.",c:"The fourth agree in a row before the doors open.",t:"Unlimited riders. This hop.",r:10,ride:1,vetoAny:1,tally:{target:4,label:"Agree",reset:"Disagree"}},
 {id:"T1",fam:"Take",n:"Three Rulings",w:"This ride",d:"Give one rider at a time your 30-second take, quietly, just to them. Each rules agree or disagree.",c:"Three rulings before the doors open, at least one of them agree.",t:"One take for all three.",r:10,ride:1,tally:{target:3,label:"Ruling"},need:"At least one agree"},
 {id:"T2",fam:"Take",n:"Filibuster",w:"Train or platform",d:"Record a take from a stranger, then argue the opposite for 90 seconds straight. The stranger watches the stopwatch; Camera stops it at any pause over three seconds.",c:"The stopwatch reaches 90.",t:"Two attempts.",r:10,watch:90,strikes:{max:2,label:"Paused"}},
 {id:"T3",fam:"Take",n:"Chain Of Custody",w:"Three rides",d:"Record a take on this ride. On your next ride a rider rules on it and adds one sentence. On the ride after that a rider rules on the amended take.",c:"Third step on camera, each step on a different ride.",t:"Your next three rides.",r:15,span:1,tally:{target:3,label:"Step",perBoard:1}},
 {id:"T4",fam:"Take",n:"Call Your Takes",w:"This ride",d:"Declare how many takes you will record before the doors open. Minimum two.",c:"The declared number is met. 2 pays 6, 3 pays 11, 4 pays 17, 5 pays 24.",t:"This hop.",r:"6–24",ride:1,declare:[2,3,4,5],cyt:1,tally:{label:"Take"}},
 {id:"T5",fam:"Take",n:"Lightning Round",w:"Train or platform",d:"Three different strangers, one take each, and each gives one reason for it.",c:"The third take and reason recorded before the timer hits zero.",t:"5 minutes.",r:10,timer:300,tally:{target:3,label:"Take"}},
 {id:"T6",fam:"Take",n:"Two Sides",w:"This ride",d:"Put one take of yours to riders one at a time until one agrees and one disagrees.",c:"One agree and one disagree with the same take, on camera, before the doors open.",t:"This hop.",r:8,ride:1},
 {id:"S0",fam:"Stunt",n:"Prove Me Wrong",w:"The platform",d:"Get cardboard and a marker first: ask a shop for a box, or buy them. Write a take on it, hold it up at the station, and defend it to anyone who stops.",c:"Three strangers argue with you on camera for 30 seconds or more each, at least one of them against.",t:"25 minutes, sign-making included.",r:12,timer:1500,tally:{target:3,label:"Argument"},need:"At least one argued against"},
 {id:"S1",fam:"Stunt",n:"Directions Only",w:"The station",d:"The app names a landmark near this station. Phone sealed away. Ask one stranger how many minutes the walk is; that is your time limit. Get there asking bystanders for directions only.",c:"You are touching the landmark before the timer hits zero.",t:"One attempt.",r:12,dirs:1},
 {id:"S3",fam:"Stunt",n:"The Line From Memory",w:"This ride",d:"Study the car map for 60 seconds, then recite every stop from here to the end of the line, up to twelve, in order with the map covered.",c:"Every one in order, no help.",t:"One retry.",r:10,ride:1,study:60,strikes:{max:2,label:"Wrong"}},
 {id:"S5",fam:"Stunt",n:"Hometown Advantage",w:"This ride",d:"Find a rider who has lived in LA longer than the two of you combined. They give you one take on how the city has changed. You argue the opposite for 30 seconds.",c:"They rule on your argument, on camera, before the doors open.",t:"One rider.",r:10,ride:1},
 {id:"S6",fam:"Stunt",n:"Scavenger",w:"Train or platform",d:"Photograph all five on the list.",c:"Fifth photo taken.",t:"20 minutes.",r:12,timer:1200,list:["A Dodgers cap","A taco truck","A fruit cart with mango on a stick","Someone on a rental scooter","Someone asleep"]},
 {id:"S7",fam:"Stunt",n:"Sell Me The Neighborhood",w:"This ride",d:"Ask a rider to sell you on the neighborhood you are riding into, in 30 seconds, and name one place you have to go there.",c:"The pitch and a named place, on camera, before the doors open.",t:"Up to two riders.",r:8,ride:1,strikes:{max:2,label:"Declined"}},
 {id:"S8",fam:"Stunt",n:"Train Pong",w:"This ride",d:"Set an empty cup on the floor or a seat across from you and throw a coin into it.",c:"Three in the cup before the doors open.",t:"Ten throws.",r:10,ride:1,throws:{max:10,target:3}},
 {id:"S9",fam:"Stunt",n:"Transfer Sprint",w:"The station",d:"Start as the doors open. Get off, exit to street level, touch the station's street sign, and get back down to the platform.",c:"On the platform before the timer hits zero.",t:"Two and a half minutes.",r:8,timer:150},
 {id:"S11",fam:"Stunt",n:"Local Plate",w:"The station",d:"Buy and finish one: a street taco from a truck or stand, a bacon-wrapped hot dog, a pastrami sandwich, a pupusa, a Double-Double. Then give a 60-second review to the most senior staff member on the premises, found by asking.",c:"The staff member gives their verdict on your verdict.",t:"No clock: lines and kitchens take what they take. Settle it before you board again.",r:10},
 {id:"S12",fam:"Stunt",n:"Seatmate",w:"This ride",d:"Sit next to a stranger. Get them to show you one photo on their phone and tell you the story behind it.",c:"The story on camera, 30 seconds or more, before the doors open.",t:"Up to two strangers.",r:10,ride:1,strikes:{max:2,label:"Declined"}},
 {id:"S13",fam:"Stunt",n:"Trade Up",w:"Three rides",d:"Trade something from your pocket with a rider for something of theirs. On each of your next two rides, trade what you got for something better.",c:"Three trades on camera, one per ride.",t:"Your next three rides.",r:15,span:1,tally:{target:3,label:"Trade",perBoard:1}},
 {id:"S14",fam:"Stunt",n:"Guess My Stop",w:"This ride",d:"Ask a rider if you can guess where they are getting off. Three guesses.",c:"A right guess, confirmed by the rider on camera.",t:"Up to three riders, one guess each, before the doors open.",r:8,ride:1,tally:{target:1,label:"Right"},strikes:{max:3,label:"Wrong"}},
 {id:"G0",fam:"Gambit",n:"Double Or Nothing",w:"This ride",d:"As the doors close, you get ten seconds to count everyone on the vehicle and say the number on camera. Then Camera walks the car and counts properly before the doors open.",c:"Your number is within two of Camera's.",t:"One attempt.",r:"Bank ×1.5, or ×0.5 on a miss",ride:1,dbl:1},
 {id:"G1",fam:"Gambit",n:"Pickpocket",w:"The next station",d:"Pick a platform Stunt on the way in. Complete it at the next station.",c:"The Stunt counts by its own rules.",t:"30 minutes from the doors opening.",r:"The station is yours, whoever holds it. Miss: 30% of your bank to them.",pick:1,timer:1800},
 {id:"G2",fam:"Gambit",n:"Eminent Domain",w:"This ride or the platform",d:"Run Three Agrees In A Row on the train into the next station, or on its platform.",c:"Three agrees in a row.",t:"One attempt: the first disagree fails it.",r:"The station is yours, free. If it was theirs, they also pay you its price.",eminent:1,tally:{target:3,label:"Agree",failOn:"Disagree"}},
 {id:"G3",fam:"Gambit",n:"Express",w:"Anywhere",d:"Name a station at least five stops away and the minute you will both be standing on its platform. Phones allowed.",c:"You arrive there by that minute.",t:"One attempt.",r:"Bank ×1.5, or ×0.5 if late",express:1,span:1},
 {id:"G4",fam:"Gambit",n:"Smash And Grab",w:"Three rides",d:"Record seven takes before the doors open at the third station from here.",c:"Seven takes in three hops.",t:"Three hops.",r:"The middle station of the three is yours, whoever holds it",span:1,smash:1,tally:{target:7,label:"Take"}},
 {id:"G5",fam:"Gambit",n:"Bank Run",w:"Anywhere",d:"Declare how many of your next three cards you will pass: two or three.",c:"The declared number is met.",t:"Your next three cards.",r:"+10 chips per card passed, or lose 10",bankrun:1,declare:[2,3]},

 {id:"G7",fam:"Gambit",n:"Duel: Four Agrees",w:"This ride",d:"Both of you run Four Agrees In A Row on the same train, taking turns with riders.",c:"First to four. Nobody there before the doors open: no chips move.",t:"One ride.",r:"Winner takes 10 chips from the loser",duel:"agree",amt:10,ride:1},

const STATION_STUNTS=["S0","S1","S6","S9","S11"];

 {n:"Rush Hour",when:"Before their next card",eff:"Their next card's time limit is halved.",dur:"One card",cost:"2 chips",k:"rush",chips:2},

 {n:"Second Opinion",when:"Before their next card",eff:"After they pass their next card, they have to find a stranger who agrees with a take of theirs. Three strangers disagree and the card fails.",dur:"One card",cost:"2 chips",k:"second",chips:2},

 id:"la",name:"Los Angeles",short:"LA",signStyle:"la",
 copy:{

 {id:"union",gx:43.6,gy:9.0,lab:"r",n:"Union Station",p:4,line:"x",lm:"Avila Adobe, Olvera Street"},

 {id:"bunker",gx:37.4,gy:11.4,lab:"a",n:"Grand Av Arts/Bunker Hill",ml:["Grand Av Arts/","Bunker Hill"],p:2,line:"ae",lock:true,lm:"Walt Disney Concert Hall"},
 {id:"pershing",gx:39.6,gy:13.6,lab:"r",n:"Pershing Square",p:2,line:"bd",lock:true,lm:"The Last Bookstore"},

 locks:{
 ltokyo:{n:"Thousand Cranes",d:"Buy a sheet of origami paper in Little Tokyo (the gift shops and bookstores sell it). Find someone who can fold a paper crane and get them to teach you, step by step. Your hands fold it; theirs don't touch it.",c:"A finished crane that stands up on its own, folded by you, with your teacher on camera.",t:"25 minutes. Up to three people asked.",r:15,timer:1500,strikes:{max:3,label:"Declined"},callOnly:1},
 civic:{n:"Public Comment",d:"Stand on the City Hall steps on Spring Street, facing Grand Park. Put one take of yours to people walking past, one at a time, and give each of them a minute, like the real thing. Camera logs each vote in the app.",c:"Ten votes, and the vote is not unanimous.",t:"15 minutes.",r:12,timer:900,poll:10},
 bunker:{n:"The Shortest Railway",d:"Walk down Grand Avenue to the top of Angels Flight at California Plaza. Ride it down to Hill Street and back up; it's a dollar a ride, less with a TAP card. On each ride, get one rider to give you a take on downtown LA, one-on-one.",c:"Two takes, one from each ride, before the timer hits zero.",t:"20 minutes. A car leaves every few minutes.",r:14,timer:1200,tally:{target:2,label:"Take"}},
 pershing:{n:"Grand Central",d:"Cross Hill Street into Grand Central Market, open since 1917. No counter used twice.",c:"Five of the seven, each on camera, inside the time.",t:"25 minutes.",r:20,timer:1500,list:["Get someone behind a counter to name the best thing in the market that isn't theirs","Get a stranger at the shared tables to rate their lunch out of ten, with one reason","Get a counter worker to tell you how long they've worked here","Buy the cheapest thing on any menu and finish it on camera","Get a stranger to guess the year the market opened, within ten years of 1917","Get a vendor to teach you how to say \"delicious\" in a language they speak, and say it back","Get a stranger to pick the neon sign they'd hang in their kitchen"],listTarget:5},
 pico:{n:"Strike The Pose",d:"Walk to Star Plaza outside Crypto.com Arena, where the bronze statues stand: Magic, Kareem, Kobe, Shaq, Gretzky and more. For three different statues, get a stranger to copy the statue's pose beside it, with you, for one photo.",c:"Three photos, three statues, three different strangers.",t:"20 minutes. Six strangers can say no before it fails.",r:14,timer:1200,tally:{target:3,label:"Photo"},strikes:{max:6,label:"Declined"}},
 hhighland:{n:"Name A Star",d:"Ask a stranger to name a famous person. Find that person's star on the Walk of Fame and touch it. If they don't have a star, or it's more than four blocks away, ask someone new. Phones allowed.",c:"Three stars touched, each named by a different stranger, before the timer hits zero.",t:"25 minutes.",r:16,timer:1500,tally:{target:3,label:"Star"}},
 hvine:{n:"Capitol Hits",d:"Stand under the Capitol Records Tower, the one built to look like a stack of records. Hum the first ten seconds of a song to a stranger; they get one guess. Capitol put out the Beatles, the Beach Boys, Sinatra, Nat King Cole and Katy Perry, if you need ideas.",c:"Three strangers each name the song you hummed, three different songs.",t:"15 minutes. Six wrong guesses fail it.",r:12,timer:900,tally:{target:3,label:"Named it"},strikes:{max:6,label:"Wrong"}},
 wwestern:{n:"Pick My Spice",d:"Find a soondubu (tofu stew) house in Koreatown near the station. Before you order, ask a stranger to pick your spice level off the menu. Order it at that level, tell the server who picked it, and finish the bowl.",c:"An empty stew bowl on camera. Rice and side dishes don't count against you.",t:"No clock: kitchens take what they take. Settle it before you board again.",r:14,callOnly:1},
 wfairfax:{n:"Urban Light",d:"Walk to Urban Light, the forest of old cast-iron street lamps in front of LACMA. Ask strangers among the lamps how many there are. One guess each, no counting out loud.",c:"A stranger guesses within 15 of the real number, 202.",t:"15 minutes. Up to eight strangers.",r:10,timer:900,tally:{target:1,label:"Within 15"},strikes:{max:8,label:"Miss"}},
 jeffusc:{n:"Crosstown Compliment",d:"Walk onto the USC campus. Get a USC student to say one genuinely nice thing about UCLA, on camera. Then get a second USC student to agree with it.",c:"The compliment and the agreement, from two different USC students, on camera.",t:"15 minutes. Six students can refuse before it fails.",r:12,timer:900,list:["A USC student says something nice about UCLA, and means it","A second USC student agrees with it"],listTarget:2,strikes:{max:6,label:"Refused"}},
 expopark:{n:"Torch Relay",d:"LA hosts the Olympics in 2028. Roll up anything you have (a map, a receipt, a sleeve of paper) into a torch. In Exposition Park, get three strangers to each carry it 20 steps beside you. The last leg ends under the Coliseum's Olympic torch, at the peristyle arches.",c:"Three legs, three strangers, the third finishing at the peristyle, on camera.",t:"20 minutes.",r:14,timer:1200,tally:{target:3,label:"Leg"}},
 culver:{n:"Screen Test",d:"Culver City calls itself the Heart of Screenland; the studios are a few blocks away. Get strangers, one at a time, to deliver a famous movie line to camera like they mean it, and name the movie.",c:"Three lines, three different movies, three strangers, before the timer hits zero.",t:"15 minutes.",r:12,timer:900,tally:{target:3,label:"Line"}},
 dtsm:{n:"End Of The Trail",d:"Walk down to Santa Monica Pier, where Route 66 ends. Photograph what you can spot, and touch the Pacific: down on the sand, hands in the water.",c:"Hands in the Pacific, plus four more from the list, photographed inside the time.",t:"25 minutes.",r:20,timer:1500,list:["Touched the Pacific, on camera","At the Santa Monica 66 End of the Trail sign","A pelican","A surfer riding a wave","A dolphin or a sea lion","Someone on the pier with a fish they caught","A volleyball game on the sand","A street performer on the pier, with their nod"],listTarget:5,req:[0]},
},

 locks:{
 northgate:{n:"Exit Poll",d:"Walk onto the John Lewis Memorial Bridge over I-5. Put one take to people crossing it, one at a time. Camera logs each vote in the app.",c:"Ten votes, and the vote is not unanimous.",t:"15 minutes.",r:12,timer:900,poll:10},
 uw:{n:"Fountain Dash",d:"From the station, get to Drumheller Fountain in the middle of campus and back, on foot. On the way, stop one student for a take on UW.",c:"Back on the platform with the take recorded before the timer hits zero.",t:"16 minutes. The route is 1.6 miles round trip.",r:15,timer:960,tally:{target:1,label:"Take"},need:"Back on the platform",callOnly:1},
 sl4:{n:"The REI Test",d:"Go into the REI flagship across the street. Pick one item under $20 and sell it to a stranger in the store in 60 seconds, on camera.",c:"They put it in their basket and say they are buying it.",t:"15 minutes. Up to three strangers.",r:12,timer:900,tally:{target:1,label:"Sold"},strikes:{max:3,label:"Declined"}},
 fh1:{n:"Dance Steps",d:"Broadway has bronze dance steps set into the sidewalk (tango, foxtrot, rumba and more). Find three different sets and dance each one with a stranger as your partner, 15 seconds on camera.",c:"Three sets, three partners, 15 seconds each.",t:"20 minutes.",r:14,timer:1200,tally:{target:3,label:"Dance"}},
 westlake:{n:"The Market Run",d:"Walk to Pike Place Market. No vendor used twice.",c:"Five of the seven, each on camera, inside the time.",t:"25 minutes.",r:20,timer:1500,list:["Get a fishmonger to name the best fish to buy today, on camera","Get a stranger to sit on Rachel the Pig and give you a take","Haggle a produce vendor below the posted price and pay it","Buy a bouquet for under $10 and get a stranger to accept it","Sing along with a busker for 15 seconds, on camera, with their nod","Add your gum to the Gum Wall in a straight line with two strangers' pieces","Get a vendor to name the best thing in the market that isn't theirs"],listTarget:5},
 symphony:{n:"Harbor Watch",d:"Walk down to the waterfront. From the piers, spot and photograph what passes. Then go to Ivar's on Pier 54 and feed a gull a fry from your hand, which is the house tradition.",c:"The gull fed, plus four of the seven sightings photographed, inside the time.",t:"20 minutes.",r:18,timer:1200,list:["Fed a gull by hand at Ivar's","A state ferry under way","The Kitsap fast ferry","A container ship","A tugboat","A seaplane overhead","A sailboat under sail","A seal or sea lion"],listTarget:5,req:[0]},
 seacenter:{n:"Needle Guess",d:"At the base of the Space Needle, ask strangers how tall it is, in feet. One guess each.",c:"A stranger guesses within 25 feet of 605.",t:"15 minutes. Up to eight strangers.",r:10,timer:900,tally:{target:1,label:"Within 25 ft"},strikes:{max:8,label:"Miss"}},
 idc:{n:"Learn The Game",d:"Walk to Hing Hay Park. Ask the people playing cards, xiangqi or mahjong to teach you, then play one hand or game with them.",c:"One full hand or game played with them, on camera.",t:"25 minutes. Up to three groups asked.",r:15,timer:1500,tally:{target:1,label:"Game played"},strikes:{max:3,label:"Declined"}},
 sl5:{n:"Shore Call",d:"From the Lake Union Park shoreline or the Center for Wooden Boats dock, hail people out on the water. Get three different boats, kayaks or paddleboards to come within shouting range and give you a one-word review of Seattle, on camera.",c:"Three one-word reviews from three different craft.",t:"15 minutes.",r:12,timer:900,tally:{target:3,label:"Review"}},
 fh6:{n:"Bánh Mì Showdown",d:"Buy a bánh mì from two different shops near 12th & Jackson. Eat them side by side on camera and pick a winner. Then go back to the winning shop and tell the most senior person there why theirs beat the other.",c:"They respond to your review, on camera.",t:"No clock: kitchens take what they take.",r:14,callOnly:1},
 fh9:{n:"Square Games",d:"Occidental Square keeps giant chess, ping pong and foosball out for anyone. Challenge a stranger to one game of your choice.",c:"You win a game: ping pong to 11, foosball to 5, or chess by checkmate or resignation.",t:"20 minutes. Up to three opponents.",r:14,timer:1200,tally:{target:1,label:"Game won"},strikes:{max:3,label:"Game lost"}},
 kingst:{n:"Departures",d:"In the King Street waiting hall, find travelers about to board. Each gives you a take about the city they are heading to.",c:"Three takes, three different destinations, on camera. Nobody misses a train.",t:"15 minutes.",r:12,timer:900,tally:{target:3,label:"Take"}},
 judkins:{n:"Across The Water",d:"Board an eastbound 2 Line train. While it crosses Lake Washington, get takes from three riders, one at a time: Seattle or the Eastside, and why.",c:"Three takes before the doors open at Mercer Island.",t:"One crossing, then ride back.",r:15,bridge:{board:"Boarded the eastbound 2 Line",boarded:"Aboard the eastbound 2 Line",need:"Board the eastbound 2 Line first.",end:"Doors open at Mercer Island",endNote:"Doors opened at Mercer Island with"},tally:{target:3,label:"Take"}},
},

/* Turf map art: landmark models, neighbourhood signs, small props and where they go, for LA and Seattle.

 const m=/^var\((--[\w-]+)\)$/.exec(x);if(m)return new Col([0,0,0],0,m[1],null);

 const w=q*A.w+(1-q)*B.w;return new Col([0,1,2].map(i=>w>0?(q*A.w*A.c[i]+(1-q)*B.w*B.c[i])/w:0),w,ka||kb,null)};

const GRAN=tri(mat("#a29c92",58));         // granite (US Bank)
const STEEL={t:mix("#f1f4f7","var(--tile)",60),r:mix("#bfcad6","var(--tile-r)",62),l:mat("#7d8a99",78)};
const COP=tri(mat("#5e8f7a",76));          // copper with patina
const TEAL=tri(mat("#3b9c8e",74));         // Wiltern terra cotta
const JADE=tri(mat("#2f7d5c",80));         // glazed green tile
const RED=tri(th("#c23b2c",90));
const WOOD=tri(mat("#9c7a55",70));

const GOLD=tri(th("#d9a441",92));
const FIELD={t:"var(--park)",d:"var(--park-d)"};

const LEAF=mix("var(--park-t)","var(--park-d)",72);
const LEAF2=mix("var(--park-t)","var(--park-d)",42);

// ---------- solids ----------
// axis-aligned iso box; faces: +Y (left, darker), +X (right, lighter), top
function box(p,X0,X1,Y0,Y1,Z0,Z1,c){
 return pg([p(X0,Y1,Z1),p(X1,Y1,Z1),p(X1,Y1,Z0),p(X0,Y1,Z0)],c.l)
  +pg([p(X1,Y0,Z1),p(X1,Y1,Z1),p(X1,Y1,Z0),p(X1,Y0,Z0)],c.r)
  +pg([p(X0,Y0,Z1),p(X1,Y0,Z1),p(X1,Y1,Z1),p(X0,Y1,Z1)],c.t);

// Cylinders are one path filled with a faceted (hard-stop) gradient: dark on the left, lit on the right, like blk().
// Gradients live once per palette in the <defs> that decorSVG()/decorDefs() emit; without them the side falls back
// to a flat mid-tone.
const GRADS={};
const gkey=c=>{let h=5381;const t=c.l+"|"+c.r;for(let i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;const k="dcg"+h.toString(36);GRADS[k]=c;return k};

 for(const k in GRADS){const c=GRADS[k],n=7;let st="";
  for(let i=n-1;i>=0;i--){const a=Math.PI*(i+1)/n,b=Math.PI*i/n,col=mix(c.r,c.l,Math.round(100*(1-(a+b)/2/Math.PI)));

  s+=`<linearGradient id="${k}">${st}</linearGradient>`}

// screen-space cylinder from z0 to z1 above a base ellipse centred (cx,cy); optional top ellipse
function drum(cx,cy,rx,ry,z0,z1,c,n,noTop){
 const d=`M${R(cx-rx)} ${R(cy-z1)}A${R(rx)} ${R(ry)} 0 0 0 ${R(cx+rx)} ${R(cy-z1)}V${R(cy-z0)}A${R(rx)} ${R(ry)} 0 0 1 ${R(cx-rx)} ${R(cy-z0)}Z`;

// fine detail lines (floors, mullions, fluting) as plain black or white at low opacity
const segs=(L,c,op,w)=>L.length?`<path d="${L.map(([a,b])=>`M${P2(a)}L${P2(b)}`).join("")}" fill="none" style="stroke:${c}" stroke-width="${w||.45}"${op==null?"":` opacity="${op}"`}/>`:"";
const dkl=(L,op)=>segs(L,"#000",op||.16);
const ltl=(L,op)=>segs(L,"#fff",op||.3);
// shift an absolute-command path (M L H V C S Q Z) by dx,dy, so many glyphs can share one <path>
const shiftPath=(d,dx,dy)=>{let cmd="",i=0;return d.replace(/([MLHVCSQZ])|(-?(?:\d+\.?\d*|\.\d+))/g,(m,c,n)=>{if(c){cmd=c;i=0;return c}const v=parseFloat(n),r=cmd==="H"?v+dx:cmd==="V"?v+dy:v+(i%2?dy:dx);i++;return " "+R(r)})};

function dome(cx,cy,rx,h,c){

 return pa(`M${R(cx-rx)} ${R(cy)}A${R(rx)} ${R(h)} 0 0 1 ${R(cx+rx)} ${R(cy)}A${R(rx)} ${R(ry)} 0 0 1 ${R(cx-rx)} ${R(cy)}Z`,c.l)
  +pa(`M${R(hx-hr)} ${R(cy)}A${R(hr)} ${R(hh)} 0 0 1 ${R(hx+hr)} ${R(cy)}A${R(hr)} ${R(hr*.6)} 0 0 1 ${R(hx-hr)} ${R(cy)}Z`,c.r)

// vertical prism on any convex X/Y polygon (counter-clockwise in X/Y), faces shaded by where they point
function prism(p,V,Z0,Z1,c){

 for(let i=0;i<n;i++){const A=V[i],B=V[(i+1)%n],nx=B[1]-A[1],ny=-(B[0]-A[0]);

const wallY=(p,X,Y,Z)=>{const o=p(X,Y,Z);return `matrix(1 .6 0 1 ${R(o[0])} ${R(o[1])})`};  // wall Y=const, u toward +X
const arch=(u,b,w,h)=>`M${R(u)} ${R(b)}V${R(b-h+w/2)}A${R(w/2)} ${R(w/2)} 0 0 1 ${R(u+w)} ${R(b-h+w/2)}V${R(b)}Z`; // arched opening, base b, w wide, h tall

// ---------- wrapper: scale, label, no pointer events ----------
function wrap(k,x,y,o,hw,body){
 o=o||{};const s=+o.s||1;let g=body;
 if(s!==1)g=`<g transform="translate(${R(x)} ${R(y)}) scale(${s}) translate(${R(-x)} ${R(-y)})">${g}</g>`;

  g+=`<text x="${R(x+dx)}" y="${R(y+(mid?14:3))}" text-anchor="${a}" font-size="9.5" font-weight="700" paint-order="stroke" stroke-width="3.2" stroke-linejoin="round" style="stroke:var(--land);fill:var(--muted)">${esc(o.t)}</text>`}

// ---------- neighbourhood sign on a short post ----------
// LA: the city's blue neighbourhood signs. Seattle: the green street-sign look. White condensed caps, white inset border.
function sign(x,y,text,style){

@keyframes dc-spin{to{transform:rotate(360deg)}}
@keyframes dc-nod{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes dc-flame{0%,100%{transform:scale(1,1);opacity:1}30%{transform:scale(.92,1.1);opacity:.9}55%{transform:scale(1.05,.9);opacity:1}80%{transform:scale(.96,1.06);opacity:.88}}
@keyframes dc-blink{0%,9%{opacity:1}10%,19%{opacity:.15}20%,29%{opacity:1}30%,100%{opacity:.15}}
}`;

// Convenience: draws one layer of a city's DECOR with a G(gx,gy)->{x,y} function.
// layer "plates" (inside the terrain group, before hills), "models" (landmarks + props, back to front),
// "signs" (after models). Draw all three before the line ribbons and stations so the art stays underneath.
function decorSVG(city,G,layer,opt){
 const D=DECOR[city];if(!D)return "";opt=opt||{};
 if(layer==="plates")return D.plates.map(pl=>`<polygon points="${pl.pts.map(([gx,gy])=>{const q=G(gx,gy);return q.x.toFixed(1)+","+q.y.toFixed(1)}).join(" ")}" style="fill:${pl.fill}"/>`).join("");
 if(layer==="signs")return D.signs.map(s=>{const q=G(s.gx,s.gy);return regionSign(q.x,q.y,s.t,city==="sea"?"sea":"la")}).join("");
 const all=[...D.landmarks,...D.props].filter(e=>MODELS[e.k]);
 all.sort((a,b)=>((b.bg?1:0)-(a.bg?1:0))||(a.gy-b.gy));
 const out=all.map(e=>{const q=G(e.gx,e.gy);return MODELS[e.k](q.x,q.y,{t:e.t,a:e.a,s:e.s,anim:opt.anim})}).join("");
 return decorDefs()+out;
}

// ================= the map: a schematic isometric board, owned stations rise as blocks =================
// Two layers. The base (land, water, hills, landmarks, lines) never changes during a game, so it is drawn once and its
// animations keep running. The overlay (stations, owners, trains, the next hop) redraws on every move.
const U=24,SK=0.22,YC=430;const TX=(x,y)=>x-SK*(y-YC);
const G=(gx,gy)=>{const y=gy*U+30;return {x:TX(gx*U+40,y),y}};
const XY=s=>G(s.gx,s.gy);
function blk(x,y,z,w,h,t,l,r){
 const T=`${x},${y-z-h} ${x+w},${y-z} ${x},${y-z+h} ${x-w},${y-z}`;
 const Lp=`${x-w},${y-z} ${x},${y-z+h} ${x},${y+h} ${x-w},${y}`;
 const R=`${x},${y-z+h} ${x+w},${y-z} ${x+w},${y} ${x},${y+h}`;
 return `<polygon points="${Lp}" style="fill:${l}"/><polygon points="${R}" style="fill:${r}"/><polygon points="${T}" style="fill:${t}"/>`;
}
function lockGlyph(x,y){return `<g transform="translate(${x-4},${y-6})"><path d="M1.5 4.5 V3 a2.5 2.5 0 0 1 5 0 V4.5" fill="none" stroke="#1a1300" stroke-width="1.6"/><rect x="0" y="4.2" width="8" height="5.6" rx="1.3" fill="#1a1300"/></g>`}
const halo=c=>`paint-order="stroke" stroke-width="3.2" stroke-linejoin="round" style="stroke:var(--land);fill:${c}"`;
const darkOf=c=>`color-mix(in srgb, ${c} 55%, #000)`;
// owner colours: index 0..5 (classic uses 0 and 1)
const OWN=i=>({t:`var(--p${i+1})`,l:`var(--p${i+1}-l)`,r:`var(--p${i+1}-r)`});
let MAPBOX=null,mapUid=0;
function mapBox(opt){
 opt=opt||{};const P=CITY.map.pad||{t:150,b:96,l:150,r:260};
 const xs=STATIONS.map(s=>XY(s).x),ys=STATIONS.map(s=>XY(s).y);
 const X0=Math.min(...xs)-P.l,X1=Math.max(...xs)+P.r,Y0=Math.min(...ys)-P.t-(opt.box?100:0),YM=Math.max(...ys)+P.b+(opt.box?230:0),Y1=YM+(opt.noLegend?0:136);
 const b={X0,X1,Y0,YM,Y1,W:X1-X0,H:Y1-Y0};if(opt.box)MAPBOX=b;if(opt.boxOut)Object.assign(opt.boxOut,b);return b;

  for(let i=0;i<h.lv;i++){const k=1-i*0.3,rx=h.rx*U*k,ry=h.ry*U*k*0.62,lift=i*6;

function majorities(st){st=st||S.st;const t=[0,0],rows=[];for(const m of MAJ){const c=[0,1].map(p=>m.ids.filter(id=>st[id].o===p).length);let a=0,b=0;if(c[0]>c[1])a=m.pts;else if(c[1]>c[0])b=m.pts;else if(c[0]){a=b=m.pts/2}t[0]+=a;t[1]+=b;rows.push({m,c,a,b})}return {t,rows}}
function chainLen(p,st){st=st||S.st;let b=0;for(const line of LINES){let c=0;for(const id of line){c=st[id].o===p?c+1:0;b=Math.max(b,c)}}return b}
function tkoPrice(id){return S.st[id].gild?TKO_CAP:Math.min(TKO_CAP,2*ST[id].p)}
function unvisited(){return STATIONS.filter(s=>!S.st[s.id].vis)}
function sealed(id){const v=S.st[id];return !!ST[id].lock&&v.o==null}
function dist(from){const d={[from]:0},q=[from];while(q.length){const a=q.shift();for(const b of ADJ[a]){const t=d[a]+EDGE[a+">"+b].t;if(d[b]==null||t<d[b]){d[b]=t;if(!q.includes(b))q.push(b)}}}return d}
function paceNeed(){
 let m=0;const u=unvisited();for(const s of u){m+=4;if(sealed(s.id))m+=15}
 m+=Math.floor(minsLeft()/180)*LAY_MIN;
 if(S.cur){const d=dist(S.cur);m+=Math.max(0,...u.map(s=>d[s.id]||0))*0.5}
 return Math.round(m);
}
function canDraw(){return !S.sz&&minsLeft()-paceNeed()>10}
function locked(){return S.done||now()>=stopAt()}
function hops(a,b){const d=dist(a);return Math.round((d[b]||0)/4)}
function spec(o){return o.lock?LOCKS[o.id]:CARD[o.id]}
function nextRec(){
 const c=S.cur;if(!c)return START_ID;
 const u=unvisited();if(!u.length)return ADJ[c][0];
 // first step toward the nearest unvisited station
 let best=null,bt=1e9;
 for(const n of ADJ[c]){const d=dist(n);const t=Math.min(...u.map(s=>(s.id===n?0:d[s.id]??1e9)))+EDGE[c+">"+n].t;if(t<bt){bt=t;best=n}}
 return best;
}
const LAY_EVERY=3*3600000,LAY_MIN=25;
function layDue(){return S.phase==="play"&&now()-(S.layLast||S.startedAt||now())>=LAY_EVERY}
function szHere(){if(!S.cur||S.sz||!S.hop||!S.hop.settled)return null;return layDue()?S.cur:null}
